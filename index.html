<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Store — Fresh Groceries Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green:      #2e7d32;
      --green-l:    #43a047;
      --green-pale: #e8f5e9;
      --green-dark: #1b5e20;
      --accent:     #ff8f00;
      --bg:         #f5fbf5;
      --card:       #ffffff;
      --text:       #1a2e1a;
      --muted:      #7a9b7a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); }

    /* NAV */
    nav {
      background: var(--green-dark);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .nav-logo {
      font-family:'Playfair Display',serif;
      color:white; font-size:1.4rem;
    }
    .nav-search {
      flex: 1; max-width: 400px; margin: 0 2rem;
      display: flex; align-items: center;
      background: rgba(255,255,255,0.15);
      border-radius: 30px; padding: 0.4rem 1rem; gap: 0.5rem;
    }
    .nav-search input {
      background: none; border: none; outline: none;
      color: white; font-family:'Nunito',sans-serif;
      font-size:0.9rem; width:100%;
    }
    .nav-search input::placeholder { color:rgba(255,255,255,0.6); }
    .nav-links { display:flex; gap:1rem; align-items:center; }
    .nav-links a {
      color:white; text-decoration:none;
      font-weight:700; font-size:0.85rem;
      padding:0.4rem 0.8rem; border-radius:20px;
      transition: background 0.2s;
    }
    .nav-links a:hover { background: rgba(255,255,255,0.15); }
    .cart-btn {
      background: var(--accent) !important;
      color: white !important;
      position: relative;
    }
    .cart-count {
      position:absolute; top:-6px; right:-6px;
      background:white; color:var(--accent);
      font-size:0.7rem; font-weight:900;
      width:18px; height:18px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-l) 100%);
      padding: 3.5rem 2rem;
      text-align: center;
      color: white;
    }
    .hero h1 {
      font-family:'Playfair Display',serif;
      font-size: 2.8rem; margin-bottom: 0.5rem;
    }
    .hero p { font-size:1.1rem; opacity:0.85; margin-bottom:1.5rem; }
    .hero-badges { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
    .hero-badge {
      background: rgba(255,255,255,0.15);
      border-radius: 30px; padding: 0.4rem 1rem;
      font-size:0.85rem; font-weight:700;
    }

    /* CATEGORIES */
    .categories {
      display: flex; gap: 0.6rem;
      padding: 1.5rem 2rem; overflow-x: auto;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .cat-btn {
      padding: 0.5rem 1.2rem;
      border-radius: 30px; border: 2px solid #e0e0e0;
      background: white; cursor: pointer;
      font-family:'Nunito',sans-serif; font-weight:700;
      font-size:0.88rem; white-space:nowrap;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: var(--green); color: var(--green); }
    .cat-btn.active {
      background: var(--green); color: white; border-color: var(--green);
    }

    /* PRODUCTS */
    .section { padding: 2rem; }
    .section-title {
      font-size:1.3rem; font-weight:900;
      color: var(--green-dark); margin-bottom:1.5rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }
    .product-card {
      background: white; border-radius:16px;
      overflow:hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor:pointer;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .product-img {
      height: 130px;
      display:flex; align-items:center; justify-content:center;
      font-size:3.5rem;
      background: var(--green-pale);
    }
    .product-body { padding:0.9rem; }
    .product-name { font-weight:800; font-size:0.95rem; margin-bottom:0.3rem; }
    .product-cat  { font-size:0.75rem; color:var(--muted); font-weight:600; margin-bottom:0.5rem; text-transform:capitalize; }
    .product-footer { display:flex; justify-content:space-between; align-items:center; }
    .product-price { font-weight:900; color:var(--green); font-size:1.05rem; }
    .add-btn {
      background:var(--green); color:white; border:none;
      width:30px; height:30px; border-radius:50%;
      font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: background 0.2s;
    }
    .add-btn:hover { background:var(--green-dark); }

    .no-products {
      text-align:center; color:var(--muted);
      padding:3rem; font-size:1.1rem; font-weight:700;
      grid-column: 1/-1;
    }

    /* CART DRAWER */
    .overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.4); z-index:200;
    }
    .overlay.open { display:block; }
    .cart-drawer {
      position:fixed; right:0; top:0; bottom:0; width:360px;
      background:white; z-index:201;
      transform:translateX(100%); transition:transform 0.3s;
      display:flex; flex-direction:column;
    }
    .cart-drawer.open { transform:translateX(0); }
    .cart-header {
      padding:1.2rem 1.5rem;
      background:var(--green-dark); color:white;
      display:flex; justify-content:space-between; align-items:center;
    }
    .cart-header h3 { font-size:1.1rem; font-weight:800; }
    .close-btn { background:none; border:none; color:white; font-size:1.5rem; cursor:pointer; }
    .cart-items { flex:1; overflow-y:auto; padding:1rem; }
    .cart-item {
      display:flex; align-items:center; gap:0.8rem;
      padding:0.8rem 0; border-bottom:1px solid #f0f0f0;
    }
    .cart-item-icon { font-size:1.8rem; }
    .cart-item-info { flex:1; }
    .cart-item-name { font-weight:700; font-size:0.9rem; }
    .cart-item-price { color:var(--green); font-weight:700; font-size:0.85rem; }
    .qty-controls { display:flex; align-items:center; gap:0.4rem; }
    .qty-btn {
      width:26px; height:26px; border-radius:50%; border:2px solid var(--green);
      background:white; color:var(--green); font-weight:900; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .qty-num { font-weight:800; min-width:20px; text-align:center; }
    .cart-empty { text-align:center; color:var(--muted); padding:3rem 1rem; font-weight:700; }
    .cart-footer { padding:1.2rem 1.5rem; border-top:2px solid var(--green-pale); }
    .cart-total {
      display:flex; justify-content:space-between;
      font-weight:900; font-size:1.1rem; margin-bottom:1rem;
      color:var(--green-dark);
    }
    .checkout-btn {
      width:100%; background:var(--green); color:white; border:none;
      padding:0.9rem; border-radius:12px; font-size:1rem; font-weight:800;
      cursor:pointer; transition:background 0.2s; text-decoration:none;
      display:block; text-align:center;
    }
    .checkout-btn:hover { background:var(--green-dark); }

    /* TOAST */
    .toast {
      position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(100px);
      background:var(--green-dark); color:white;
      padding:0.7rem 1.5rem; border-radius:30px;
      font-weight:700; font-size:0.9rem;
      transition:transform 0.3s; z-index:300;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* FOOTER */
    footer {
      background:var(--green-dark); color:rgba(255,255,255,0.7);
      text-align:center; padding:1.5rem;
      font-size:0.85rem; font-weight:600; margin-top:2rem;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">🛒 Smart Store</div>
  <div class="nav-search">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search products..."/>
  </div>
  <div class="nav-links">
    <a href="/login">Login</a>
    <a href="/login">Register</a>
    <a href="#" class="cart-btn" onclick="toggleCart()">
      🛒 Cart
      <span class="cart-count" id="cartCount">0</span>
    </a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Fresh Groceries, Delivered Fast 🌿</h1>
  <p>Shop from the best quality products at amazing prices</p>
  <div class="hero-badges">
    <span class="hero-badge">🚚 30-min Delivery</span>
    <span class="hero-badge">🌱 Farm Fresh</span>
    <span class="hero-badge">💰 Best Prices</span>
    <span class="hero-badge">↩️ Easy Returns</span>
  </div>
</div>

<!-- CATEGORY TABS -->
<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">🛒 All</button>
  <button class="cat-btn" onclick="filterCat('fruits', this)">🍎 Fruits</button>
  <button class="cat-btn" onclick="filterCat('dairy', this)">🥛 Dairy</button>
  <button class="cat-btn" onclick="filterCat('snacks', this)">🍟 Snacks</button>
  <button class="cat-btn" onclick="filterCat('beverages', this)">🧃 Beverages</button>
  <button class="cat-btn" onclick="filterCat('household', this)">🧹 Household</button>
  <button class="cat-btn" onclick="filterCat('general', this)">📦 General</button>
</div>

<!-- PRODUCTS -->
<div class="section">
  <div class="section-title">🛍️ Our Products</div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<!-- CART DRAWER -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>🛒 Your Cart</h3>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">₹0</span>
    </div>
    <a href="/checkout" class="checkout-btn" id="checkoutBtn">Proceed to Checkout →</a>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<footer>© 2025 Smart Store — All Rights Reserved</footer>

<script>
  // Category icons map
  const catIcons = {
    fruits:     '🍎',
    dairy:      '🥛',
    snacks:     '🍟',
    beverages:  '🧃',
    household:  '🧹',
    general:    '🛒',
    '':         '🛒'
  };

  // Load products from Flask
  const allProducts = [
    {% for p in products %}
    {
      id: {{ p[0] }},
      name: "{{ p[1] | e }}",
      price: {{ p[2] }},
      qty_stock: {{ p[3] }},
      cat: "{{ p[4] if p[4] else 'general' }}"
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  let cart = JSON.parse(localStorage.getItem('smartstore_cart') || '[]');
  let currentCat = 'all';

  // Render products
  function renderProducts(products) {
    const grid = document.getElementById('productsGrid');
    if (products.length === 0) {
      grid.innerHTML = '<div class="no-products">😔 No products found in this category.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-img">${catIcons[p.cat] || '🛒'}</div>
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-cat">${p.cat}</div>
          <div class="product-footer">
            <span class="product-price">₹${p.price}</span>
            <button class="add-btn" onclick="addToCart(${p.id})">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Filter by category
  function filterCat(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.cat === cat);
    renderProducts(filtered);
  }

  // Search
  document.getElementById('searchInput').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const base = currentCat === 'all' ? allProducts : allProducts.filter(p => p.cat === currentCat);
    const filtered = base.filter(p => p.name.toLowerCase().includes(q));
    renderProducts(filtered);
  });

  // Add to cart
  function addToCart(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    const existing = cart.find(c => c.id === id);
    if (existing) {
      existing.qty++;
    } else {
      cart.push({ id: product.id, name: product.name, price: product.price, qty: 1, icon: catIcons[product.cat] || '🛒' });
    }
    saveCart();
    showToast(`✅ ${product.name} added to cart!`);
    updateCartCount();
  }

  function saveCart() {
    localStorage.setItem('smartstore_cart', JSON.stringify(cart));
  }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').textContent = total;
  }

  function toggleCart() {
    document.getElementById('cartDrawer').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
    renderCart();
  }

  function renderCart() {
    const el = document.getElementById('cartItems');
    const totalEl = document.getElementById('cartTotal');
    if (cart.length === 0) {
      el.innerHTML = '<div class="cart-empty">Your cart is empty 😔<br/>Add some products!</div>';
      totalEl.textContent = '₹0';
      return;
    }
    let total = 0;
    el.innerHTML = cart.map(item => {
      total += item.price * item.qty;
      return `
        <div class="cart-item">
          <span class="cart-item-icon">${item.icon}</span>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">₹${item.price} each</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>`;
    }).join('');
    totalEl.textContent = '₹' + total;
  }

  function changeQty(id, delta) {
    const item = cart.find(c => c.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
    saveCart();
    updateCartCount();
    renderCart();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Init
  renderProducts(allProducts);
  updateCartCount();
</script>
</body>
</html>
