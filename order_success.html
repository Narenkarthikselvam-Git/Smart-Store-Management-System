<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Placed — Smart Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f7f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 90%;
      animation: popIn 0.5s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .tick {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: bounce 0.6s ease 0.3s both;
    }

    @keyframes bounce {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #2e7d32;
      margin-bottom: 0.5rem;
    }

    p {
      color: #666;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .name {
      color: #2e7d32;
      font-weight: 800;
    }

    .divider {
      border: none;
      border-top: 2px dashed #e8f5e9;
      margin: 1.5rem 0;
    }

    .info-box {
      background: #f1f8e9;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #555;
    }

    .btn {
      display: inline-block;
      background: #2e7d32;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #1b5e20; }
  </style>
</head>
<body>

<div class="card">
  <div class="tick">✅</div>
  <h1>Order Placed!</h1>
  <p>Thank you, <span class="name">{{ name }}</span>! 🎉</p>
  <p>Your order has been received and is being processed.</p>

  <hr class="divider"/>

  <div class="info-box">
    🚚 Estimated delivery: <strong>30–45 minutes</strong><br/>
    📞 We'll call you to confirm your order shortly.
  </div>

  <a href="/" class="btn">🛒 Continue Shopping</a>
</div>

<script>
  // Clear the cart after successful order
  localStorage.removeItem('smartstore_cart');
</script>

</body>
</html>
