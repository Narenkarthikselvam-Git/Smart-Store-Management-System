<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product — Smart Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f7f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }
    h2 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #2e7d32;
      margin-bottom: 1.8rem;
      text-align: center;
    }
    label {
      display: block;
      font-weight: 700;
      color: #333;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 1.1rem;
      outline: none;
      transition: border 0.2s;
      background: white;
    }
    input:focus, select:focus { border-color: #2e7d32; }
    .btn {
      width: 100%;
      background: #2e7d32;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #1b5e20; }
    .back {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #2e7d32;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <h2>➕ Add Product</h2>
  <form action="/add_product" method="POST">

    <label>Product Name</label>
    <input type="text" name="name" placeholder="e.g. Fresh Apples" required/>

    <label>Price (₹)</label>
    <input type="number" name="price" placeholder="e.g. 120" required/>

    <label>Quantity / Stock</label>
    <input type="number" name="quantity" placeholder="e.g. 50" required/>

    <label>Category</label>
    <select name="category" required>
      <option value="">-- Select Category --</option>
      <option value="fruits">🍎 Fruits</option>
      <option value="dairy">🥛 Dairy</option>
      <option value="snacks">🍟 Snacks</option>
      <option value="beverages">🧃 Beverages</option>
      <option value="household">🧹 Household</option>
      <option value="general">🛒 General</option>
    </select>

    <button type="submit" class="btn">✅ Add Product</button>
  </form>
  <a href="/view_products" class="back">← Back to Products</a>
</div>
</body>
</html>
